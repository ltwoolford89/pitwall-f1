function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3000);}
function save(){try{localStorage.setItem('pitwall-career-v1',JSON.stringify(career));}catch(e){toast('Your browser could not save progress');}}
function defaultCareer(name,gender){return {name,gender,stage:0,team:'Local Kart Academy',cash:1200,reputation:0,skillPoints:0,skills:[],purchases:[],raceCount:0,stageRaces:0,wins:0,energy:87,morale:80,fitness:49,week:1,contractRaces:0,history:[],lastReport:null};}
let career=null;
try{career=JSON.parse(localStorage.getItem('pitwall-career-v1')||'null');if(career && (!career.name||!Array.isArray(career.skills)))career=null;}catch(e){career=null;}
const stages=['KARTING','FORMULA 4','FORMULA 3','FORMULA 2','FORMULA 1'];
const nextStages=[{min:10,races:3,cost:800},{min:27,races:4,cost:1300},{min:50,races:5,cost:1800},{min:80,races:5,cost:0}];
const skillTree=[{id:'braking',name:'Late braking',desc:'+4 pace · Brake later with control',requires:[],boost:4,cost:1},{id:'fitness',name:'Endurance',desc:'+4 pace · Recover physical condition',requires:[],boost:4,cost:1},{id:'racecraft',name:'Racecraft',desc:'+5 pace · Overtakes & defending',requires:['braking'],boost:5,cost:2},{id:'wet',name:'Wet-weather master',desc:'+3 pace · Confident in the rain',requires:['braking'],boost:3,cost:1},{id:'qualifying',name:'One-lap specialist',desc:'+5 pace · Fast qualifying laps',requires:['racecraft'],boost:5,cost:2},{id:'strategy',name:'Tyre strategist',desc:'+4 pace · Strong decision-making',requires:['racecraft'],boost:4,cost:2},{id:'focus',name:'Mental focus',desc:'+5 pace · Stay cool under pressure',requires:['fitness'],boost:5,cost:2}];
const lifestyle=[{id:'meals',name:'Balanced meal plan',cost:350,desc:'Boosts fitness +5 and energy +8',fit:5,energy:8,morale:0},{id:'gym',name:'Training membership',cost:600,desc:'Boosts fitness +8 and pace',fit:8,energy:0,morale:1},{id:'apartment',name:'Comfortable apartment',cost:1400,desc:'Boosts morale +12 and energy +8',fit:0,energy:8,morale:12},{id:'physio',name:'Professional physio',cost:1900,desc:'Boosts fitness +9 and energy +12',fit:9,energy:12},{id:'sim',name:'Home racing simulator',cost:2600,desc:'Adds a permanent +6 pace bonus',fit:0,energy:0,morale:4}];
const JOBS=[{id:'cafe',name:'Café shift',pay:220,energy:16,morale:4},{id:'garage',name:'Mechanic shift',pay:350,energy:25,morale:3},{id:'tutor',name:'Driver coaching',pay:470,energy:30,morale:5}];
const teams=[{name:'Cadillac',min:80,bonus:1800,pay:1600,power:60},{name:'Haas',min:82,bonus:2100,pay:1800,power:64},{name:'Alpine',min:83,bonus:2400,pay:2000,power:66},{name:'Racing Bulls',min:85,bonus:2600,pay:2300,power:69},{name:'Audi',min:88,bonus:2800,pay:2400,power:68},{name:'Williams',min:90,bonus:3100,pay:2700,power:68},{name:'Aston Martin',min:95,bonus:4100,pay:3100,power:72},{name:'Red Bull Racing',min:122,bonus:13000,pay:9000,power:90},{name:'Ferrari',min:124,bonus:14000,pay:10000,power:91},{name:'McLaren',min:123,bonus:14000,pay:10000,power:91},{name:'Mercedes',min:128,bonus:16000,pay:11500,power:94}];
function teamSpec(){return teams.find(x=>x.name===career?.team)||null;}
function skillPower(){return career.skills.reduce((n,id)=>n+(skillTree.find(x=>x.id===id)?.boost||0),0)+(career.purchases.includes('sim')?6:0);}
function myPace(){return Math.round(32+skillPower()+career.fitness*.15+career.morale*.09+career.energy*.12+(teamSpec()?.power-50||0));}
function home(){const n=nextRace(),leader=data.drivers[0],team=data.constructors[0];return `
<section class="main-tab"><div class="hero"><div class="eyebrow">2026 season · Race control</div><h1>Your race weekend,<br><span style="color:var(--accent)">sorted.</span></h1><p>Championship standings, every race session in Adelaide time, and your own road to Formula 1.</p><div class="pills">${statusPill('AUSTRALIA / ADELAIDE')}${statusPill('DARK MODE ACTIVE','good')}</div></div>
<div class="sectionhead"><div><div class="micro">On the horizon</div><h2>Next race</h2></div><a href="${F1}racing/2026" target="_blank" rel="noopener noreferrer">Official calendar ↗</a></div>
<div class="card"><div class="split"><span class="round">ROUND ${n.round.toString().padStart(2,'0')}</span>${statusPill(n.sprint?'SPRINT WEEKEND':'GRAND PRIX')}</div><h2 style="margin:13px 0 4px;letter-spacing:-.04em">${safe(n.name)}</h2><p class="sub" style="margin:0">${safe(n.location)} · ${fmtDay(n.race)}</p><div class="kpi highlight">${fmtHour(n.race)}</div><div class="tiny">Race start · Adelaide time (ACST/ACDT as applicable)</div><div class="actions">${uiBtn('Weekend schedule ↗','go-calendar','lime')}<a class="btn flat" href="${KAYO}" target="_blank" rel="noopener noreferrer">Watch on Kayo ↗</a></div></div>
<div class="sectionhead"><div><div class="micro">Season pulse</div><h2>Championship</h2></div>${uiBtn('Full standings →','go-standings','flat')}</div>
<div class="grid2"><div class="card"><div class="micro">Drivers' leader</div><div style="font-size:18px;font-weight:900;margin-top:12px">${safe(leader.last)}</div><div class="sub">${safe(leader.team)}</div><div class="kpi">${leader.points}<span style="font-size:12px;color:var(--muted)"> PTS</span></div></div><div class="card"><div class="micro">Top constructor</div><div style="font-size:18px;font-weight:900;margin-top:12px">${safe(team.team)}</div><div class="sub">World Championship</div><div class="kpi">${team.points}<span style="font-size:12px;color:var(--muted)"> PTS</span></div></div></div>
<div class="sectionhead"><div><div class="micro">Your journey</div><h2>Career mode</h2></div></div>
<div class="card"><div class="split"><div><strong>${career?safe(career.name):'Create your racing legend'}</strong><p class="sub" style="margin:5px 0 0">${career?stages[career.stage]+' · '+safe(career.team):'Start in karting, earn contracts and reach the grid.'}</p></div><span style="font-size:30px">🏎️</span></div><div class="actions">${uiBtn(career?'Continue career →':'Start career →','go-career','primary')}</div></div>
${sourceFooter()}</section>`;}
function standings(){const arr=st.standing==='drivers'?data.drivers:data.constructors;return `<section class="main-tab"><div class="sectionhead"><div><div class="micro">2026 championship</div><h2>Standings</h2></div></div><div class="seg" role="group" aria-label="Standings selection"><button type="button" data-standing="drivers" class="${st.standing==='drivers'?'active':''}">DRIVERS</button><button type="button" data-standing="constructors" class="${st.standing==='constructors'?'active':''}">CONSTRUCTORS</button></div><p class="tiny" style="margin:13px 0 8px">${safe(data.lastUpdated)} · Points and wins from results feed</p><div class="card" style="padding:8px 14px">${arr.map(x=>`<div class="leader"><div class="pos">${x.position}</div><div class="stripe" style="background:${teamColour(x.team)}"></div><div style="min-width:0"><div class="name">${st.standing==='drivers'?`${safe(x.last)} <small>${safe(x.first)}</small>`:safe(x.team)}</div><div class="team">${st.standing==='drivers'?safe(x.team):'Constructor championship'}</div></div><div class="pts">${x.points}<small>${st.standing==='drivers'?x.wins+' WINS':'POINTS'}</small></div></div>`).join('')}</div>${sourceFooter()}</section>`;}
function inferSlug(r){return r.slug||'2026';}
function scheduleFor(r){const arr=r.sessions?.filter(x=>x.dateStart&&!x.cancelled)||[];if(arr.length)return arr.slice().sort((a,b)=>new Date(a.dateStart)-new Date(b.dateStart));if(r.short==='Singapore')return [
{name:'Practice 1',dateStart:'2026-10-09T08:30:00Z'},
{name:'Sprint Qualifying',dateStart:'2026-10-09T12:30:00Z'},
{name:'Sprint',dateStart:'2026-10-10T09:00:00Z'},
{name:'Qualifying',dateStart:'2026-10-10T13:00:00Z'},
{name:'Race',dateStart:'2026-10-11T12:00:00Z'}];
return [{name:'Race',dateStart:r.race}];}
function prediction(r){const hasResults=data.podiums?.length>5;const recent=(data.podiums||fallbackPodiums).slice(-5);const season=(data.podiums||fallbackPodiums);const weights={technical:{mercedes:7,mclaren:3,ferrari:3,red_bull:1},street:{ferrari:7,mclaren:4,red_bull:3,mercedes:3},highspeed:{mercedes:3,mclaren:6,red_bull:5,ferrari:2},balanced:{mercedes:5,mclaren:4,red_bull:3,ferrari:3}};
const scores=data.drivers.map(d=>{const points=d.points;let score=points*.17+Number(d.wins)*3;for(const p of season){const i=p.indexOf(d.code);if(i>=0)score+=[2.5,1.6,1][i];}for(const p of recent){const i=p.indexOf(d.code);if(i>=0)score+=[8,5,3][i];}score+=weights[r.profile]?.[aliases[d.team]]||0;return {...d,score};});return scores.sort((a,b)=>b.score-a.score).slice(0,3);}
function calendar(){let races=sortedRaces();if(st.filter==='upcoming')races=races.filter(r=>!started(r));if(st.filter==='past')races=races.filter(r=>started(r));return `<section class="main-tab"><div class="sectionhead"><div><div class="micro">Adelaide / South Australia</div><h2>Race calendar</h2></div></div><p class="sub" style="margin-top:-3px">Every displayed time is converted to Adelaide time, including daylight saving. Tap a race for practice, qualifying, sprint and race sessions.</p><div class="seg"><button data-filter="upcoming" class="${st.filter==='upcoming'?'active':''}">UPCOMING</button><button data-filter="all" class="${st.filter==='all'?'active':''}">ALL RACES</button><button data-filter="past" class="${st.filter==='past'?'active':''}">COMPLETED</button></div><p class="tiny">${data.sessionOnline?'Session schedule loaded from OpenF1':'Showing available session details; race times available for all rounds'} · verify changes with F1.</p><div class="racegrid">${races.map(r=>raceCard(r)).join('')||'<div class="empty">No races in this section.</div>'}</div>${sourceFooter()}</section>`;}
function raceCard(r){const ex=st.expanded===r.round;const preds=prediction(r);const isPast=started(r);const actual=data.podiums[r.round-1];return `<div class="card racecard"><button type="button" data-race="${r.round}" aria-expanded="${ex}"><div class="rc-main"><span class="round">ROUND ${String(r.round).padStart(2,'0')} ${r.sprint?'· SPRINT':''}</span><span class="rc-arrow">${ex?'−':'+'}</span></div><div class="racename">${safe(r.name)}</div><div class="rc-meta"><span>${fmtDay(r.race)}</span><span>·</span><span>${fmtHour(r.race)} Adelaide</span>${isPast?' · Completed':''}</div></button>${ex?`<div class="raceinner"><div class="micro">Session timetable · Adelaide</div><div style="margin-top:8px">${scheduleFor(r).map(s=>`<div class="schedule"><div class="session">${safe(s.name)}</div><div class="when">${fmtHour(s.dateStart)}<small>${fmtDay(s.dateStart)}</small></div></div>`).join('')}</div><div class="actions"><a href="${KAYO}" target="_blank" rel="noopener noreferrer" class="btn primary">▶ Open Kayo Sports</a><a class="btn flat" href="${F1}racing/2026/${encodeURIComponent(inferSlug(r))}" target="_blank" rel="noopener noreferrer">F1 race page ↗</a></div><hr class="thin"><div class="split"><div class="micro">${isPast&&actual?'Recorded podium':'Predicted podium'}</div>${!isPast?'<span class="badge">FAN FORECAST</span>':''}</div><div class="podium" style="margin:12px 0">${(isPast&&actual?actual.map(code=>data.drivers.find(d=>d.code===code)||{last:code,team:''}):preds).map((d,i)=>`<div class="item"><div class="medal">${['🥇','🥈','🥉'][i]}</div><div class="dname">${safe(d.last)}</div><div class="dteam">${safe(d.team)}</div></div>`).join('')}</div><p class="note">${isPast&&actual?'Past podium from the bundled 2026 results snapshot (where available).':'Simple non-betting forecast based on 2026 points, recent podiums, wins and broad circuit profile. For fun, not a guarantee.'}</p></div>`:''}</div>`;}
function sourceFooter(){return `<div class="sources">DATA: <a href="${F1}results/2026/drivers" target="_blank" rel="noopener noreferrer">Official F1 standings</a> · <a href="${F1}racing/2026" target="_blank" rel="noopener noreferrer">Official F1 calendar</a> · <a href="https://api.jolpi.ca/docs/" target="_blank" rel="noopener noreferrer">Jolpica results API</a> · <a href="https://openf1.org/docs/" target="_blank" rel="noopener noreferrer">OpenF1 sessions</a>. Free third-party feeds may be delayed or unavailable. No official F1 affiliation.</div>`;}
function careerPage(){if(!career)return setup();return `<section class="main-tab"><div class="sectionhead"><div><div class="micro">Interactive career simulator</div><h2>Driver career</h2></div><span class="badge">${stages[career.stage]}</span></div><div class="card" style="margin-bottom:14px;background:linear-gradient(125deg,#2a2940,#171f2d)"><div class="split"><div><div class="micro">Your driver</div><h3 class="game-title">${safe(career.name)}</h3><p class="sub" style="margin:2px 0 0">${safe(career.team)} · Week ${career.week}</p></div><span style="font-size:39px">🏁</span></div><div class="stats" style="margin-top:18px"><div class="stat"><div class="lab">BALANCE</div><div class="num" style="font-size:19px">${fmtMoney(career.cash)}</div></div><div class="stat"><div class="lab">REPUTATION</div><div class="num">${career.reputation}</div></div><div class="stat"><div class="lab">SKILL PTS</div><div class="num">${career.skillPoints}</div></div></div></div><div class="game-tabs">${['overview','race','skills','lifestyle','contracts','history'].map(t=>`<button type="button" class="${st.careerTab===t?'active':''}" data-career-tab="${t}">${({overview:'Overview',race:'Race weekend',skills:'Skill tree',lifestyle:'Lifestyle & work',contracts:'Contracts',history:'Race diary'})[t]}</button>`).join('')}</div><div style="margin-top:15px">${({overview:gameOverview,race:gameRace,skills:gameSkills,lifestyle:gameLifestyle,contracts:gameContracts,history:gameHistory})[st.careerTab]()}</div><div class="sources">Fictional career simulation. Real team names are used as references, but career contracts, wages, events and race results are invented. Progress is saved on this device, not to a server.</div></section>`;}
function setup(){return `<section class="main-tab"><div class="hero"><div class="eyebrow">Begin your story</div><h1>From karting<br>to <span style="color:var(--accent)">the grid.</span></h1><p>Create a driver, earn money, unlock skills, sign deals and climb through the racing categories.</p></div><div class="card wide-desktop"><div class="micro">New save · Career mode</div><h2>Build your driver</h2><form id="createCareer"><div><label for="driverName">Driver name</label><input id="driverName" name="driverName" placeholder="Enter your driver's name" maxlength="26" required></div><div><label for="driverGender">Gender (cosmetic, does not affect ability)</label><select id="driverGender" name="driverGender"><option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option></select></div><div class="sub">You begin with ${fmtMoney(1200)}, a karting seat and the option to take part-time jobs to fund racing.</div><button class="btn primary wide" type="submit">CREATE CAREER →</button></form></div></section>`;}
function gameOverview(){const can=career.stage<4?nextStages[career.stage]:null;return `<div class="card"><div class="micro">Driver condition</div><div class="stats" style="margin-top:10px">${[['Energy',career.energy],['Fitness',career.fitness],['Morale',career.morale]].map(([k,v])=>`<div class="stat"><div class="lab">${k}</div><div class="num">${v}<small style="font-size:11px">/100</small></div><div class="progress"><i style="width:${v}%"></i></div></div>`).join('')}</div><div class="split" style="margin-top:17px"><div><div class="micro">Projected pace</div><div class="kpi">${myPace()}</div></div><div><div class="micro">Career wins</div><div class="kpi">${career.wins}</div></div></div></div><div class="card" style="margin-top:12px"><div class="micro">Current objective</div><h3>${career.stage===4?'Build your F1 legacy':`Earn promotion to ${stages[career.stage+1]}`}</h3><p class="sub">${can?`Complete ${can.races} races at this level and reach ${can.min} reputation. Current: ${career.stageRaces}/${can.races} races and ${career.reputation}/${can.min} reputation.`:'Race for points, increase your reputation and negotiate with stronger teams.'}</p><div class="actions">${uiBtn('Enter a race →','game-race','lime')}${uiBtn('Explore contracts','game-contracts','flat')}</div></div><div class="card" style="margin-top:12px"><div class="micro">Your progress</div><div class="pills" style="margin-top:10px">${stages.map((x,i)=>statusPill((i<=career.stage?'✓ ':'○ ')+x,i===career.stage?'good':'' )).join('')}</div></div></div>`;}
function gameRace(){const stage=stages[career.stage];const entry=[310,550,710,890,0][career.stage];const energyOK=career.energy>=18;const afford=career.cash>=entry;const names=['Karting Trophy','F4 Sprint Challenge','F3 Feature Race','F2 Championship Round','Formula 1 Grand Prix'];return `<div class="card"><div class="micro">Week ${career.week} · ${stage}</div><h3 class="game-title" style="margin-top:10px">${career.stage===4?safe(nextRace().name):names[career.stage]}</h3><p class="sub">Race against simulated competitors. Your abilities, preparation and a little luck determine your finish. The commentary changes each event.</p><div class="grid2" style="margin:15px 0"><div class="stat"><div class="lab">ENTRY COST</div><div class="num">${fmtMoney(entry)}</div></div><div class="stat"><div class="lab">CURRENT PACE</div><div class="num">${myPace()}</div></div></div>${uiBtn('START RACE ↗','run-race','primary wide')}${!afford?`<p class="note red">You need ${fmtMoney(entry-career.cash)} more. Take a part-time job.</p>`:''}${!energyOK?`<p class="note red">Your energy is low. Rest before racing.</p>`:''}${career.lastReport?`<hr class="thin"><div class="micro">Latest result</div><h3 style="margin-bottom:6px">P${career.lastReport.position} · ${safe(career.lastReport.title)}</h3><p class="sub">${fmtMoney(career.lastReport.reward)} earned · ${career.lastReport.rep} reputation gained</p><ol class="commentary">${career.lastReport.lines.map(l=>`<li>${safe(l)}</li>`).join('')}</ol>${career.lastReport.classification?.length?`<hr class="thin"><div class="micro">Simulated F1 classification</div>${career.lastReport.classification.slice(0,10).map((d,i)=>`<div class="schedule"><span class="session" style="color:${d.player?'var(--lime)':'inherit'}">P${i+1} · ${safe(d.name)}${d.player?' ★':''}</span><span class="tiny">${safe(d.team)}</span></div>`).join('')}${career.lastReport.position>10?`<p class="note">Your result: P${career.lastReport.position} · ${safe(career.name)}</p>`:''}`:''}`:''}</div>`;}
function gameSkills(){return `<div class="card"><div class="split"><div><div class="micro">Driver development</div><h3 style="margin:7px 0">Skill tree</h3></div><span class="badge">${career.skillPoints} POINTS</span></div><p class="sub">Earn skill points by racing. Some upgrades only unlock after learning prerequisite skills.</p>${skillTree.map(s=>{const owned=career.skills.includes(s.id),unlocked=s.requires.every(k=>career.skills.includes(k));return `<div class="market"><div><h4>${owned?'✓ ':''}${safe(s.name)}</h4><p>${safe(s.desc)}${s.requires.length?'<br>Requires: '+safe(s.requires.map(id=>skillTree.find(k=>k.id===id)?.name).join(', ')):''}</p></div><button class="btn ${owned?'flat':''}" data-buy-skill="${s.id}" ${owned||!unlocked||career.skillPoints<s.cost?'disabled':''}>${owned?'OWNED':!unlocked?'LOCKED':s.cost+' SP'}</button></div>`;}).join('')}</div>`;}
function gameLifestyle(){return `<div class="card"><div class="micro">Real-life balance · In-game money only</div><h3>Improve your lifestyle</h3><p class="sub">Purchases are permanent upgrades and help your driver perform better on track.</p>${lifestyle.map(x=>`<div class="market"><div><h4>${career.purchases.includes(x.id)?'✓ ':''}${safe(x.name)}</h4><p>${safe(x.desc)}</p></div><button class="btn" data-buy-life="${x.id}" ${career.purchases.includes(x.id)||career.cash<x.cost?'disabled':''}>${career.purchases.includes(x.id)?'OWNED':fmtMoney(x.cost)}</button></div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="micro">Extra income</div><h3>Part-time jobs</h3><p class="sub">Pick up shifts when racing is expensive. Work increases income but takes energy, so plan recovery.</p>${JOBS.map(x=>`<div class="market"><div><h4>${x.name}</h4><p>Earn ${fmtMoney(x.pay)} · Uses ${x.energy} energy</p></div><button class="btn flat" data-job="${x.id}" ${career.energy<x.energy?'disabled':''}>WORK</button></div>`).join('')}<div class="market"><div><h4>Rest & recover</h4><p>Free · Restore energy, recover morale, advance one week</p></div><button class="btn lime" data-action="rest">REST</button></div></div>`;}
function gameContracts(){const req=career.stage<4?nextStages[career.stage]:null;const eligible=req&&career.reputation>=req.min&&career.stageRaces>=req.races&&career.cash>=req.cost;return `<div class="card"><div class="micro">Your motorsport future</div><h3>Contract offers</h3>${req?`<p class="sub">To advance to ${stages[career.stage+1]}, complete ${req.races} races at this level, earn ${req.min} reputation and pay the ${fmtMoney(req.cost)} development cost${career.stage===3?' (fully sponsored)':'.'}</p><div class="market"><div><h4>${stages[career.stage+1]} Development Seat</h4><p>${career.stageRaces}/${req.races} races · ${career.reputation}/${req.min} reputation · ${fmtMoney(req.cost)}</p></div><button class="btn lime" data-action="promote" ${eligible?'':'disabled'}>SIGN</button></div>`:`<p class="sub">Negotiate fictional contracts with real-world F1 team names. Better seats require a stronger reputation. New contracts last four races before switching teams.</p><div class="tiny">Current team: ${safe(career.team)} · Contract races completed: ${career.contractRaces}/4</div>`}${career.stage===4?teams.map(t=>`<div class="market"><div><h4><span style="color:${teamColour(t.name)}">●</span> ${safe(t.name)} ${career.team===t.name?'(CURRENT)':''}</h4><p>Needs ${t.min} reputation · ${fmtMoney(t.bonus)} signing bonus · ${fmtMoney(t.pay)}/race</p></div><button class="btn" data-team="${safe(t.name)}" ${career.team===t.name||career.reputation<t.min||career.contractRaces<4?'disabled':''}>SIGN</button></div>`).join(''):''}</div>`;}
function gameHistory(){return `<div class="card"><div class="split"><div><div class="micro">Career archive</div><h3>Race diary</h3></div><span class="badge">${career.raceCount} RACES</span></div>${career.history.length?career.history.slice().reverse().slice(0,30).map(h=>`<div class="market"><div><h4>P${h.position} · ${safe(h.title)}</h4><p>Week ${h.week} · ${safe(h.team)} · ${fmtMoney(h.reward)} earned</p></div><span class="badge">+${h.rep} REP</span></div>`).join(''):'<p class="sub">Your race results will appear here after your first event.</p>'}<div class="actions">${uiBtn('Back to track →','game-race','lime')}</div></div>`;}
function render(){const node=$('#app');node.innerHTML=({home,standings,calendar,career:careerPage})[st.tab]();document.querySelectorAll('.bottomnav button').forEach(b=>{const on=b.dataset.tab===st.tab;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false');});}
function nav(tab){st.tab=tab;if(tab==='career'&&!career)st.careerTab='overview';render();window.scrollTo({top:0,behavior:'instant'});}
function careerNav(tab){st.careerTab=tab;render();}
function updateCareer(message){save();render();if(message)toast(message);}
function promote(){const n=nextStages[career.stage];if(!n||career.stageRaces<n.races||career.reputation<n.min||career.cash<n.cost)return;career.cash-=n.cost;career.stage++;career.stageRaces=0;career.energy=Math.min(100,career.energy+30);career.morale=Math.min(100,career.morale+10);career.team=['','F4 Regional Academy','F3 Development Team','F2 Academy','Cadillac'][career.stage];career.contractRaces=career.stage===4?0:4;career.lastReport=null;if(career.stage===4){career.cash+=teams[0].bonus;toast('You earned your first Formula 1 seat!');}updateCareer('Promoted to '+stages[career.stage]+'!');}
function signTeam(team){const t=teams.find(x=>x.name===team);if(!t||career.stage!==4||career.reputation<t.min||career.contractRaces<4||career.team===t.name)return;career.team=t.name;career.cash+=t.bonus;career.contractRaces=0;career.morale=Math.min(100,career.morale+5);updateCareer('Signed with '+t.name+'!');}
function work(id){const j=JOBS.find(x=>x.id===id);if(!j||career.energy<j.energy)return;career.cash+=j.pay;career.energy-=j.energy;career.morale=Math.min(100,career.morale+j.morale);career.week++;updateCareer(`Shift completed: +${fmtMoney(j.pay)}`);}
function rest(){career.energy=Math.min(100,career.energy+38+(career.purchases.includes('apartment')?7:0));career.morale=Math.min(100,career.morale+12);career.week++;updateCareer('Recovered and ready for another week');}
function buySkill(id){const s=skillTree.find(x=>x.id===id);if(!s||career.skills.includes(id)||career.skillPoints<s.cost||!s.requires.every(k=>career.skills.includes(k)))return;career.skillPoints-=s.cost;career.skills.push(id);if(id==='fitness')career.fitness=Math.min(100,career.fitness+5);updateCareer('Unlocked '+s.name);}
function buyLifestyle(id){const x=lifestyle.find(s=>s.id===id);if(!x||career.purchases.includes(id)||career.cash<x.cost)return;career.cash-=x.cost;career.purchases.push(id);career.fitness=Math.min(100,career.fitness+(x.fit||0));career.energy=Math.min(100,career.energy+(x.energy||0));career.morale=Math.min(100,career.morale+(x.morale||0));updateCareer(x.name+' purchased');}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function race(){if(!career)return;const cost=[310,550,710,890,0][career.stage];if(career.cash<cost)return toast('Earn more money with a part-time job');if(career.energy<18)return toast('Rest before racing');const stage=career.stage;const gridSize=stage===4?22:18;const power=myPace();const roll=Math.random();const stageDifficulty=[42,49,57,66,78][stage];let pos=Math.round(gridSize/2+(stageDifficulty-power)*.20+(Math.random()-.5)*10);pos=Math.max(1,Math.min(gridSize,pos));if(stage===4){const team=teamSpec();pos=Math.max(1,Math.min(22,Math.round(13+(75-(team?.power||60))*.2-(power-70)*.18+(Math.random()-.5)*9)));}
const win=pos===1;const base=[{first:1300,low:120},{first:1650,low:240},{first:2000,low:340},{first:2600,low:500},{first:0,low:0}][stage];const reward=stage===4?(teamSpec()?.pay||1200)+Math.max(0,(23-pos))*180:Math.round(base.low+(gridSize-pos)*(base.first-base.low)/(gridSize-1));const rep=stage===4?Math.max(2,Math.round((23-pos)*.9)):Math.max(2,Math.round((gridSize+2-pos)*.85));const title=stage===4?nextRace().name:['Karting Trophy','F4 Sprint Challenge','F3 Feature Race','F2 Championship Round'][stage];const competitors=stage===4?data.drivers.filter(d=>d.team!==career.team).slice(0,10).map(d=>d.last):['Morgan','Riley','Jordan','Taylor','Sam','Casey','Alex','Jamie'];const rival1=pick(competitors),rival2=pick(competitors.filter(x=>x!==rival1));let lines=[`Lights out! ${career.name} launches from the starting grid for ${career.team}.`,pick([`${rival1} sweeps across the track, but ${career.name} holds the line.`,`A clean opening sector puts ${career.name} right into the midfield fight.`,`A tight first corner leaves absolutely no room for error.`]),`Lap 4: Race engineer reports a solid rhythm and asks the driver to protect the tyres.`,pick([`${career.name} goes wheel to wheel with ${rival2} through the fast corners.`,`The crowd roars as ${career.name} attacks on the next straight.`,`A brave defensive move keeps ${rival1} at bay.`]),`Half distance: ${career.name} is running P${Math.min(gridSize,pos+Math.round(Math.random()*3))}. A big result is still possible.`,pick([`Fresh tyres bring the lap times down as the stint unfolds.`,`The pit wall calls for a smooth stop. Back onto the circuit!`,`Changing grip levels reward patience and consistency.`]),`Final laps: ${rival2} is close behind. Every corner matters.`,`CHEQUERED FLAG! ${career.name} finishes P${pos} in ${title}.`,pos<=3?`A podium finish! The team celebrates a huge step forward.`:pos<=gridSize/2?'A strong drive earns praise from the team principal.':'There is work to do, but the data will help the next race.'];
career.cash=career.cash-cost+reward;career.energy=Math.max(4,career.energy-(17+Math.floor(Math.random()*13)));career.morale=Math.min(100,Math.max(12,career.morale+(pos<=3?11:pos<=gridSize/2?5:-4)));career.reputation+=rep;career.raceCount++;career.stageRaces++;if(win)career.wins++;career.skillPoints+=1+(win?1:0);career.week++;if(stage===4)career.contractRaces++;let classification=[];if(stage===4){let realGrid=data.drivers.slice(0,23);const removedIndex=realGrid.findIndex(d=>d.team===career.team);if(removedIndex>=0)realGrid.splice(removedIndex,1);realGrid=realGrid.slice(0,21);classification=realGrid.map(d=>({name:d.first+' '+d.last,team:d.team,player:false}));classification.splice(pos-1,0,{name:career.name,team:career.team,player:true});}const report={position:pos,title,reward,rep,week:career.week,team:career.team,lines,classification};career.lastReport=report;career.history.push({position:pos,title,reward,rep,week:career.week,team:career.team});career.history=career.history.slice(-100);updateCareer(`P${pos} · +${fmtMoney(reward)} · +${rep} reputation`);}
function onAction(action){if(action.startsWith('go-'))return nav(action.substring(3));if(action.startsWith('game-'))return careerNav(action.substring(5));({rest, promote,'run-race':race})[action]?.();}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab)return nav(tab.dataset.tab);const a=e.target.closest('[data-action]');if(a)return onAction(a.dataset.action);const standing=e.target.closest('[data-standing]');if(standing){st.standing=standing.dataset.standing;return render();}const filter=e.target.closest('[data-filter]');if(filter){st.filter=filter.dataset.filter;st.expanded=null;return render();}const card=e.target.closest('[data-race]');if(card){const k=Number(card.dataset.race);st.expanded=st.expanded===k?null:k;return render();}const ct=e.target.closest('[data-career-tab]');if(ct)return careerNav(ct.dataset.careerTab);const s=e.target.closest('[data-buy-skill]');if(s)return buySkill(s.dataset.buySkill);const l=e.target.closest('[data-buy-life]');if(l)return buyLifestyle(l.dataset.buyLife);const j=e.target.closest('[data-job]');if(j)return work(j.dataset.job);const t=e.target.closest('[data-team]');if(t)return signTeam(t.dataset.team);});
document.addEventListener('submit',e=>{if(e.target.id==='createCareer'){e.preventDefault();const name=($('#driverName')?.value||'').trim();if(!name)return toast('Please enter a driver name');career=defaultCareer(name,$('#driverGender').value);save();st.careerTab='overview';render();toast('Welcome to the karting paddock!');}});
function fetchJson(path,limit=8500){return Promise.race([fetch(path,{mode:'cors',cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}),new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),limit))]);}
async function refreshStandings(){try{const results=await Promise.allSettled([fetchJson(API+YEAR+'/driverstandings.json'),fetchJson(API+YEAR+'/constructorstandings.json')]);const d=results[0].status==='fulfilled'?results[0].value?.MRData?.StandingsTable?.StandingsLists?.[0]?.DriverStandings:null;const c=results[1].status==='fulfilled'?results[1].value?.MRData?.StandingsTable?.StandingsLists?.[0]?.ConstructorStandings:null;if(d?.length){data.drivers=d.map(x=>({position:+x.position,first:x.Driver.givenName,last:x.Driver.familyName,code:x.Driver.code||x.Driver.driverId.toUpperCase().slice(0,3),team:(x.Constructors||[]).at(-1)?.name||'Unknown',points:+x.points,wins:+x.wins}));data.online=true;}if(c?.length){data.constructors=c.map(x=>({position:+x.position,team:x.Constructor.name,points:+x.points}));data.online=true;}if(data.online)data.lastUpdated='Live API · '+new Intl.DateTimeFormat('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',timeZone:TZ}).format(new Date());}catch(e){}finally{setStatus();render();}}
function normalizeSessionName(n){return ({'First Practice':'Practice 1','Second Practice':'Practice 2','Third Practice':'Practice 3','Sprint Shootout':'Sprint Qualifying','Sprint Qualifying':'Sprint Qualifying','Sprint':'Sprint','Race':'Race','Qualifying':'Qualifying'})[n]||n;}
async function refreshSessions(){try{const sessions=await fetchJson(OPENF1+'sessions?year='+YEAR,10000);if(!Array.isArray(sessions)||!sessions.length)return;let added=0;for(const r of data.races){const raceTime=new Date(r.race).getTime();const matching=sessions.filter(s=>Math.abs(new Date(s.date_start).getTime()-raceTime)<4*86400000&&s.session_name&&(!s.is_cancelled));if(!matching.length)continue;const unique=new Map();for(const s of matching){if(/Practice|Sprint|Qualifying|Race/i.test(s.session_name))unique.set(s.session_name+'|'+s.date_start,{name:normalizeSessionName(s.session_name),dateStart:s.date_start,cancelled:false});}if(unique.size){r.sessions=[...unique.values()];added++;}}data.sessionOnline=added>=3;}catch(e){}finally{if(st.tab==='calendar')render();}}
async function refreshPodiums(){try{const j=await fetchJson(API+YEAR+'/results.json?limit=2000',10000);const races=j?.MRData?.RaceTable?.Races;if(!Array.isArray(races)||!races.length)return;for(const r of races){const n=Number(r.round);const top=(r.Results||[]).filter(x=>+x.position<=3).sort((a,b)=>+a.position-+b.position).map(x=>x.Driver.code||x.Driver.driverId.toUpperCase().slice(0,3));if(n>0&&top.length===3)data.podiums[n-1]=top;}}catch(e){}finally{if(st.tab==='calendar')render();}}
async function refreshCalendar(){try{const j=await fetchJson(API+YEAR+'.json?limit=100',10000);const races=j?.MRData?.RaceTable?.Races;if(!Array.isArray(races)||races.length<18)return;const revised=[];for(let i=0;i<races.length;i++){const r=races[i],match=data.races.find(x=>x.name===r.raceName||x.short.toLowerCase()===r.Circuit?.Location?.country?.toLowerCase()||Math.abs(new Date(x.race)-new Date(r.date+'T'+(r.time||'00:00:00Z')))<86400000);const date=r.date+'T'+(r.time||'12:00:00Z');const sessions=[];for(const [key,name] of [['FirstPractice','Practice 1'],['SecondPractice','Practice 2'],['ThirdPractice','Practice 3'],['SprintQualifying','Sprint Qualifying'],['Sprint','Sprint'],['Qualifying','Qualifying']])if(r[key]?.date&&r[key]?.time)sessions.push({name,dateStart:r[key].date+'T'+r[key].time});sessions.push({name:'Race',dateStart:date});revised.push({round:+r.round,name:r.raceName,short:match?.short||r.Circuit?.Location?.country||r.raceName.replace(/ Grand Prix/,'').trim(),location:r.Circuit?.Location?.locality||match?.location||'',race:date,profile:match?.profile||'balanced',sessions,sprint:!!(r.Sprint||r.SprintQualifying)||match?.sprint||false,slug:match?.slug||'2026'});}data.races=revised;}catch(e){}finally{if(st.tab==='calendar'||st.tab==='home')render();}}
function setStatus(){$('#dataStatus').innerHTML=`<span class="dot" style="background:${data.online?'var(--lime)':'#ffb76e'};box-shadow:none"></span>${data.online?'API DATA':'SAVED SNAPSHOT'}`;}
render();setStatus();refreshStandings();refreshCalendar().then(()=>refreshSessions());refreshPodiums();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
